# Builds the iPhone app and uploads it to TestFlight. Start it by hand:
# Actions → "iOS app to TestFlight" → Run workflow.
# It needs an Apple Developer account and the secrets in docs/SETUP.md (part 5).
name: iOS app to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.sukantasaha.surtaal' }}
      # The app finds the AI teacher on the Cloudflare site.
      SURTAAL_API_BASE: ${{ vars.SURTAAL_SITE_URL }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the Apple secrets
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Apple secrets:$missing. See docs/SETUP.md, part 5."
            exit 1
          fi
          if [ -z "$SURTAAL_API_BASE" ]; then
            echo "::warning::The SURTAAL_SITE_URL variable is not set, so the AI teacher is off in this build."
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Apple only accepts apps built with a current Xcode.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the web app and copy it into the iOS project
        run: |
          npm ci
          npm run ios:sync

      - name: Save the App Store Connect key for this run
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Build and sign the app
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SurTaal.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SurTaal.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build $BUILD_NUMBER was sent to App Store Connect. It shows in TestFlight after Apple finishes processing (usually 5–30 minutes)."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
